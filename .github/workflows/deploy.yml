name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: docker network create proxy
      - run: docker compose -f deploy/docker-compose.yml config --quiet
      - run: docker build -f deploy/Dockerfile .

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Deploy
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          SSH_TARGET: ${{ secrets.SSH_TARGET }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          ssh -i ~/.ssh/deploy_key "$SSH_TARGET" "SHA=$GITHUB_SHA bash -s" <<'REMOTE'
          set -euo pipefail
          cd ~/quilleaf-be
          git fetch -q origin
          git merge -q --ff-only "$SHA"
          cd deploy
          docker compose up -d --build --remove-orphans sync-server
          docker image prune -f >/dev/null
          REMOTE
