# Runs behind the shared Caddy from the infra repo, which reaches this
# service as sync-server:1234 on the external `proxy` network.
# The project name stays `deploy` so the existing deploy_sync-data volume is reused.
name: deploy

services:
  sync-server:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      HOST: 0.0.0.0
      PORT: "1234"
      DB_PATH: /app/data/sync.db
    volumes:
      - sync-data:/app/data
    networks: [default, proxy]
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  sync-data: {}

networks:
  proxy:
    external: true
